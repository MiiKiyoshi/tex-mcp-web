<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tex-web</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>tex-web</h1>
    <span id="main-file" class="main-file">—</span>
    <nav class="view-tabs" aria-label="Workspace view">
      <button class="view-tab active" type="button" data-view="pdf">Preview</button>
      <button class="view-tab" type="button" data-view="source">Source</button>
      <button class="view-tab" type="button" data-view="split">Split</button>
    </nav>
    <select id="layout-select" class="hidden" aria-label="Where Split puts the translation"
            title="Where Split puts the translation">
      <option value="preview">Translation under Preview</option>
      <option value="source">Translation under Source</option>
      <option value="column">Translation beside Source</option>
      <option value="replace">Translation instead of Source</option>
    </select>
    <span id="compile-status" class="compile-status">idle</span>
    <div class="actions">
      <button id="compile-btn" type="button">Compile</button>
      <button id="paper-comment-btn" type="button" title="Add a paper-level comment">+ Note</button>
      <button id="translation-btn" class="hidden" type="button" title="The source translated, beside the Preview or the editor">Translation</button>
      <button id="sidebar-toggle-btn" type="button" title="Toggle sidebar (\)">⇥</button>
    </div>
  </header>

  <main class="layout view-pdf">
    <div id="workspace">
      <section id="pdf-pane">
        <div id="pdf-viewer">
          <p class="placeholder">No PDF yet — waiting for first compile…</p>
        </div>
        <div id="reference-preview" class="reference-preview hidden" title="Click to select reference text">
          <div id="reference-preview-text"></div>
        </div>
      </section>

      <div id="split-grip" class="workspace-grip" role="separator" tabindex="0"
           aria-label="Resize the Preview and the panes beside it" aria-orientation="vertical"
           aria-valuemin="15" aria-valuemax="85" aria-valuenow="50" title="Drag to resize"></div>
      <section id="source-pane" aria-label="Source editor">
        <div class="source-toolbar">
          <select id="source-file" aria-label="Source file"></select>
          <span id="source-status" class="source-status">Open Source to edit</span>
          <button id="source-font-smaller-btn" type="button" title="Smaller source text" aria-label="Smaller source text"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 8 6l5 12M4.8 14h6.4M15 12h6"/></svg></button>
          <button id="source-font-larger-btn" type="button" title="Larger source text" aria-label="Larger source text"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 8 6l5 12M4.8 14h6.4M15 12h6M18 9v6"/></svg></button>
          <button id="source-wrap-btn" type="button" aria-pressed="true" title="Wrap long lines" aria-label="Wrap long lines"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h15a3 3 0 1 1 0 6h-4M3 18h7"/><path d="m16 16-2 2 2 2"/></svg></button>
          <button id="source-vim-btn" type="button" aria-pressed="false" title="Vim keys (:w saves)" aria-label="Vim keys (:w saves)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 22 12 12 22 2 12z"/><path d="M8.5 8 12 16l3.5-8"/></svg></button>
          <button id="source-comment-btn" type="button" disabled title="Select source text to comment" aria-label="Select source text to comment"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></svg></button>
          <button id="source-pdf-btn" type="button" disabled title="Select source text to show it in the Preview" aria-label="Select source text to show it in the Preview"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button id="source-reload-btn" type="button" disabled title="Reload the file from disk" aria-label="Reload the file from disk"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button id="source-save-btn" type="button" disabled title="Save (Ctrl+S)" aria-label="Save (Ctrl+S)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
        </div>
        <div id="source-editor"></div>
      </section>
      <div id="translation-grip" class="workspace-grip off" role="separator" tabindex="0"
           aria-label="Resize the translation" aria-orientation="horizontal"
           aria-valuemin="15" aria-valuemax="85" aria-valuenow="64" title="Drag to resize"></div>
      <section id="translation-pane" class="off" aria-label="Translation of the source">
        <div class="translation-head"><b id="translation-language">Translation</b>
          <select id="translation-file" aria-label="Source file to read translated">
            <option value="">Auto</option>
          </select>
          <span id="translation-page"></span><span id="translation-status"></span></div>
        <div id="translation-body"></div>
      </section>
    </div>

    <aside id="sidebar">
      <div id="sidebar-grip" class="sidebar-grip" role="separator" tabindex="0" aria-orientation="horizontal"
           aria-controls="workspace sidebar" aria-label="Resize the review panel" title="Drag to resize"></div>
      <div id="sidebar-width-grip" class="sidebar-width-grip" role="separator" tabindex="0" aria-orientation="vertical"
           aria-controls="workspace sidebar" aria-label="Resize the review panel width" title="Drag to resize"></div>
      <div class="sidebar-tabs">
        <button class="tab-btn" data-tab="sections">Sections</button>
        <button class="tab-btn active" data-tab="comments">Comments<span id="comments-tab-count" class="tab-count hidden"></span></button>
        <button class="tab-btn" data-tab="compile">Compile<span id="compile-tab-count" class="tab-count hidden"></span></button>
      </div>

      <div id="tab-comments" class="tab-pane active">
        <div class="filter-row">
          <select id="comment-filter" aria-label="Comment status">
            <option value="open" selected>open</option>
            <option value="resolved">resolved</option>
            <option value="archived">archived</option>
            <option value="all">all</option>
          </select>
          <!-- Icons, with the words as title and aria-label. Each button shows the one drawing
               that fits its state; a count rides beside the drawing where the action has one.
               A button with nothing to do is greyed out, not taken away: the row keeps one shape. -->
          <button id="fold-all-btn" class="icon-btn" type="button" aria-label="Expand all" title="Expand all">
            <svg class="icon-expand" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4-4 4 4M4 10l4 4 4-4"/></svg>
            <svg class="icon-collapse hidden" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2l4 4 4-4M4 14l4-4 4 4"/></svg>
          </button>
          <button id="pick-all-btn" class="icon-btn" type="button" aria-label="Select all" title="Select all">
            <svg class="icon-select" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 8.5l2 2 4-4"/></svg>
            <svg class="icon-clear hidden" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 8h6"/></svg>
          </button>
          <button id="resolve-picked-btn" class="icon-btn" type="button" disabled aria-label="Resolve" title="Resolve the picked comments">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M5 8l2 2 4-4"/></svg><span class="count"></span>
          </button>
          <button id="archive-picked-btn" class="icon-btn" type="button" disabled aria-label="Archive" title="Archive the picked comments">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h12v3H2z"/><path d="M3 6v7h10V6M6 9h4"/></svg><span class="count"></span>
          </button>
          <button id="reopen-picked-btn" class="icon-btn" type="button" disabled aria-label="Reopen" title="Reopen the picked comments">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5"/><path d="M13 3v3h-3"/></svg><span class="count"></span>
          </button>
          <button id="call-agent-btn" class="icon-btn agent-offline" type="button" aria-label="Queue call for agent" title="Agent is not waiting; queue this call until it reconnects">
            <span id="agent-waiting-dot" class="agent-dot"></span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.5 1.5h-11z"/><path d="M6.5 14a1.5 1.5 0 0 0 3 0"/></svg>
            <span id="call-agent-word" class="count"></span>
          </button>
        </div>
        <div id="comments-list" class="comments-list"></div>
      </div>

      <div id="tab-compile" class="tab-pane">
        <div id="error-banner" class="error-banner"></div>
      </div>

      <div id="tab-sections" class="tab-pane">
        <div id="sections-list"><p class="placeholder">Loading…</p></div>
      </div>
    </aside>
  </main>
</div>

<dialog id="compose-dialog">
  <form method="dialog" id="compose-form">
    <h3 id="compose-title">New comment</h3>
    <p id="compose-anchor" class="compose-anchor"></p>
    <textarea id="compose-text" rows="4" required placeholder="leave a comment for the coding agent…"></textarea>
    <details id="compose-suggestion-details" class="compose-suggestion">
      <summary>Suggest a rewrite (optional)</summary>
      <label class="compose-field-label">Original</label>
      <textarea id="compose-suggestion-old" rows="3" placeholder="the text as currently written"></textarea>
      <label class="compose-field-label">Replacement</label>
      <textarea id="compose-suggestion-new" rows="3" placeholder="the text as you'd like it to read"></textarea>
    </details>
    <div class="dialog-actions">
      <button type="button" id="compose-cancel">Cancel</button>
      <button type="submit" id="compose-submit">Post</button>
    </div>
  </form>
</dialog>

    <script src="/static/ace/ace.js?v=1.44.0"></script>
    <script type="module" src="/static/viewer.js"></script>
</body>
</html>
