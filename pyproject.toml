[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "tex-mcp-web"
version = "0.8.5"
description = "LaTeX MCP server for paper review: comment on the PDF while an AI agent edits the source, with Overleaf sync."
dynamic = ["readme"]
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MiiKiyoshi" }
]
keywords = ["tex", "latex", "pdf", "watcher", "viewer", "review", "annotation", "agent", "mcp", "mcp-server", "overleaf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = [
    "watchdog>=3.0.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "pymupdf>=1.24.3",
    "mcp>=1.0,<2",
    "httpx",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
tex-mcp-web = "tex_mcp_web.cli:main"
tex-mcp = "tex_mcp_web.cli:main_mcp"
tex-web = "tex_mcp_web.cli:main_serve"

[project.urls]
Homepage = "https://github.com/MiiKiyoshi/tex-mcp-web"
Repository = "https://github.com/MiiKiyoshi/tex-mcp-web"

[tool.hatch.build.targets.wheel]
packages = ["tex_mcp_web"]

# The README's films are shown from GitHub, so the source archive leaves them out.
[tool.hatch.build.targets.sdist]
exclude = ["docs/images"]

# PyPI shows the README with its images and pages named by path, which it takes from GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?:)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/MiiKiyoshi/tex-mcp-web/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?:)([^)]+)\)'
replacement = '](https://github.com/MiiKiyoshi/tex-mcp-web/blob/main/\1)'

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=tex_mcp_web --cov-report=term-missing"

[tool.coverage.run]
source = ["tex_mcp_web"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
