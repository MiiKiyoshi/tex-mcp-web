name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # TeX Live from its own action, which the runners keep between runs: apt took up to twelve
      # minutes to install it.
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
      - name: Python packages
        run: pip install -e ".[dev]"
      - name: Tests
        run: |
          google-chrome --version
          # A browser test that a loaded runner fails once is run again by itself.
          python -m pytest || python -m pytest --last-failed

  # The page's users are on Windows and macOS too: every test runs there as well, the browser's
  # in Chrome, with TeX Live for the papers they build.
  other-systems:
    runs-on: ${{ matrix.os }}
    # A test that waits for ever fails after two minutes (pyproject.toml), so the job ends well
    # inside this.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
      - name: Python packages
        run: pip install -e ".[dev]"
      - name: Tests
        shell: bash
        run: |
          # The runner's own chromedriver can be older than its Chrome. Without it Selenium
          # fetches the one that fits.
          while command -v chromedriver >/dev/null; do rm -f "$(command -v chromedriver)" || break; done
          unset CHROMEWEBDRIVER
          latexmk --version | head -2
          # A browser test that a loaded runner fails once is run again by itself.
          python -m pytest -rfs || python -m pytest -rfs --last-failed

  # Mac users read the page in Safari, whose engine is not Chrome's: the browser tests run
  # in it too, through its own driver. It has no window without a screen and takes one
  # session at a time, so its tests run one after another.
  safari:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
      - name: Python packages
        run: pip install -e ".[dev]"
      - name: Safari's driver
        run: |
          sudo safaridriver --enable
          /usr/bin/safaridriver --version
      - name: Browser tests in Safari
        env:
          TEX_MCP_BROWSER_KIND: safari
        run: |
          python -m pytest -n 0 -rfs tests/test_browser.py \
            || python -m pytest -n 0 -rfs --last-failed tests/test_browser.py
