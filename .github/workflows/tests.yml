name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base
      - name: Python packages
        run: pip install -e ".[dev]"
      - name: Tests
        run: |
          google-chrome --version
          # A browser test that a loaded runner fails once is run again by itself.
          python -m pytest -o addopts="" -q || python -m pytest -o addopts="" -q --last-failed

  # The page's users are on Windows and macOS too. The tests that build a paper and the
  # browser's stay on Linux, where LaTeX is installed above.
  other-systems:
    runs-on: ${{ matrix.os }}
    # The tests take a few minutes. One that waits for ever is stopped, and says where it
    # stood after two minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python packages
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -o addopts="" -o faulthandler_timeout=120 -q --ignore=tests/test_browser.py
