name: tests

# The tests read neither the README nor the docs, so a change to those alone runs none.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  pull_request:
    paths-ignore: ["README.md", "docs/**"]

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # TeX Live from its own action, which the runners keep between runs: apt took up to twelve
      # minutes to install it.
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
      - name: Python packages
        run: pip install -e ".[dev]"
      - name: Tests
        env:
          TEX_MCP_FAILURES: ${{ runner.temp }}/failures
        run: |
          google-chrome --version
          # A browser test that a loaded runner fails once is run again by itself.
          python -m pytest || python -m pytest --last-failed
      # What the page showed when a browser test failed, a failure that passed when run again
      # too: its screenshot, markup, fields and console.
      - name: Pages of failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-linux-${{ matrix.python }}
          path: ${{ runner.temp }}/failures
          if-no-files-found: ignore

  # The page's users are on Windows and macOS too: every test runs there as well, the browser's
  # in Chrome, with TeX Live for the papers they build.
  other-systems:
    runs-on: ${{ matrix.os }}
    # A test that waits for ever fails after two minutes (pyproject.toml), so the job ends well
    # inside this.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # A system's tests run in parts, each on a runner of its own: the browser tests take
      # these runners several times as long as Linux's.
      matrix:
        include:
          - {os: windows-latest, part: "1/3"}
          - {os: windows-latest, part: "2/3"}
          - {os: windows-latest, part: "3/3"}
          - {os: macos-latest, part: "1/2"}
          - {os: macos-latest, part: "2/2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
      - name: Python packages
        run: pip install -e ".[dev]"
      - name: Tests
        shell: bash
        env:
          TEX_MCP_FAILURES: ${{ runner.temp }}/failures
        run: |
          # The runner's own chromedriver can be older than its Chrome. Without it Selenium
          # fetches the one that fits.
          while command -v chromedriver >/dev/null; do rm -f "$(command -v chromedriver)" || break; done
          unset CHROMEWEBDRIVER
          latexmk --version | head -2
          # Where this system spends a browser test's time.
          python -m tests.machine_times
          # A browser test that a loaded runner fails once is run again by itself.
          python -m pytest -rfs --part ${{ matrix.part }} || python -m pytest -rfs --last-failed
      - name: Pages of failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/failures
          if-no-files-found: ignore

  # Mac users read the page in Safari, whose engine is not Chrome's: the browser tests run
  # in it too, through its own driver. It has no window without a screen and takes one
  # session at a time, so its tests run one after another.
  safari:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
      - name: Python packages
        run: pip install -e ".[dev]"
      - name: Safari's driver
        run: |
          sudo safaridriver --enable
          /usr/bin/safaridriver --version
      - name: Browser tests in Safari
        env:
          TEX_MCP_BROWSER_KIND: safari
          TEX_MCP_FAILURES: ${{ runner.temp }}/failures
        run: |
          python -m pytest -n 0 -rfs --part ${{ matrix.part }} tests/test_browser.py \
            || python -m pytest -n 0 -rfs --last-failed tests/test_browser.py
      - name: Pages of failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-safari-${{ strategy.job-index }}
          path: ${{ runner.temp }}/failures
          if-no-files-found: ignore
