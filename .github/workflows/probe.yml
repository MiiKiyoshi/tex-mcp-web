name: probe

# A diagnostic run in Safari, started by hand.
on:
  workflow_dispatch:

jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
      - run: pip install -e ".[dev]"
      - run: |
          sudo safaridriver --enable
          sw_vers
          system_profiler SPDisplaysDataType | grep -i -E "resolution|display" || true
      - env:
          TEX_MCP_BROWSER_KIND: safari
        run: python .github/probe/safari_pdf.py probe-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe-out
