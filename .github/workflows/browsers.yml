name: browsers

# The review page's browser tests in Chrome on Windows and macOS, started by hand. The
# screenshots a test saves on failure are kept with the run.
on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The page shows a PDF only once the paper builds, so most of these tests need LaTeX.
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
      - name: Python packages
        run: pip install -e ".[dev]"
      - name: Browser tests
        shell: bash
        run: |
          # The runner's own chromedriver can be older than its Chrome. Without it Selenium
          # fetches the one that fits.
          while command -v chromedriver >/dev/null; do rm -f "$(command -v chromedriver)" || break; done
          unset CHROMEWEBDRIVER
          latexmk --version | head -2
          python -m pytest -o addopts="" -o faulthandler_timeout=300 -q -rfs tests/test_browser.py \
            || python -m pytest -o addopts="" -o faulthandler_timeout=300 -q -rf --last-failed tests/test_browser.py
